<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イランの声 - インタラクティブマップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>イランの記憶 - インタラクティブマップ</h1>
        </header>

        <div class="main-content">
            <div class="map-container">
                <div id="map"></div>
                <div class="map-controls">
                    <button id="toggleMapType" class="control-btn">
                        <span id="mapTypeText">航空写真</span>
                    </button>
                    <button id="toggleHeatmap" class="control-btn">
                        <span id="heatmapText">ヒートマップ表示</span>
                    </button>
                </div>
            </div>

            <div class="sidebar">
                <div class="filter-section">
                    <h3>フィルター</h3>
                    <div class="tag-filter">
                        <label for="tagSelect">タグで絞り込み:</label>
                        <select id="tagSelect">
                            <option value="">すべてのタグ</option>
                        </select>
                    </div>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="コメントを検索...">
                    </div>
                </div>

                <div class="comments-section">
                    <h3>戦争の記憶一覧</h3>
                    <div id="commentsList" class="comments-list">
                        <!-- 戦争の記憶がここに動的に追加されます -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 戦争の記憶詳細モーダル -->
        <div id="commentModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="modalContent">
                    <!-- モーダル内容がここに動的に追加されます -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="script.js"></script>
</body>
</html>

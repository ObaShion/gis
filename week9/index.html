<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koe</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-content">
        <div class="sidebar">
            <!-- <h1>コメント一覧</h1> -->
            <div id="commentsList" class="comments-list">
                <!-- 投稿がここに動的に追加されます -->
            </div>
        </div>
        
        <div class="map-container">
            <div id="map"></div>
            <div class="map-controls">
                <button id="toggleMapType" class="control-btn" onclick="toggleMapType()">
                    <span id="mapTypeText">航空写真</span>
                </button>
            </div>
        </div>

       
    </div>

    <!-- 投稿詳細モーダル -->
    <div id="commentModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalContent">
                <!-- モーダル内容がここに動的に追加されます -->
            </div>
        </div>
    </div>
    
    <!-- コメント投稿モーダル -->
    <div id="commentPostModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>コメントを投稿</h3>
            <div class="comment-form">
                <textarea id="commentText" placeholder="あなたの思いを共有してください..."></textarea>
                <div class="emotion-buttons">
                    <button class="emotion-btn" data-emotion="怒り">😠 怒り</button>
                    <button class="emotion-btn" data-emotion="悲しみ">😢 悲しみ</button>
                    <button class="emotion-btn" data-emotion="希望">🙏 希望</button>
                    <button class="emotion-btn" data-emotion="共感">💙 共感</button>
                </div>
                <button id="postCommentBtn" class="post-btn">投稿する</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="script.js"></script>
</body>
</html>
